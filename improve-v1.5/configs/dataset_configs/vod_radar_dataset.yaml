DATASET: VodRadarDataset
DATA_PATH: ../../vod-min
POINT_DIM: 7
CLASS_NAMES: [Car, Pedestrian, Cyclist]

CLASS_MAP:
  Car: [Car, truck, vehicle_other]
  Pedestrian: [Pedestrian, human_depiction]
  Cyclist: [Cyclist, bicycle, rider, moped_scooter, motor, ride_other, ride_uncertain, bicycle_rack]

MAP_CLASS_TO_KITTI:
  Car: Car
  Pedestrian: Pedestrian
  Cyclist: Cyclist

DATA_SPLIT:
  train: train
  test: test

INFO_PATH:
  train: [vod_radar_infos_train.pkl]
  test: [vod_radar_infos_test.pkl]
TEST_HAS_LABEL: True

FOV_POINTS_ONLY: False
APPEND_VELOCITY_TO_GT_BOXES: True
QUICK_EVAL_CENTER_DIST: 2.0
CREATE_GT_DATABASE: False
POINT_DROPOUT_PROB: 0.05

RADAR_FEATURE_INDEX:
  rcs: 3
  v_r: 4
  v_r_comp: 5
  time: 6

VELOCITY_SUPERVISION:
  MIN_POINTS: 3
  MAX_SPEED: 35.0
  MAX_RESIDUAL: 2.5
  MAX_CONDITION: 5000.0
  HUBER_DELTA: 1.5
  IRLS_ITERS: 5
  REG_LAMBDA: 0.001
  WEAK_WEIGHT: 0.35
  STRONG_WEIGHT: 1.0
  USE_FALLBACK_HEADING: True

POINT_CLOUD_RANGE: [0.0, -25.6, -3.0, 51.2, 25.6, 2.0]

POINT_FEATURE_ENCODING:
  encoding_type: absolute_coordinates_encoding
  used_feature_list: [x, y, z, rcs, v_r, v_r_comp, time]
  src_feature_list: [x, y, z, rcs, v_r, v_r_comp, time]

DATA_AUGMENTOR:
  DISABLE_AUG_LIST: [gt_sampling, random_world_rotation]
  AUG_CONFIG_LIST:
    - NAME: gt_sampling
      USE_ROAD_PLANE: False
      DB_INFO_PATH: [vod_radar_dbinfos_train.pkl]
      PREPARE:
        filter_by_min_points: ['Car:5', 'Pedestrian:5', 'Cyclist:5']
      SAMPLE_GROUPS: ['Car:10', 'Pedestrian:10', 'Cyclist:10']
      NUM_POINT_FEATURES: 7
      DATABASE_WITH_FAKELIDAR: False
      REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
      LIMIT_WHOLE_SCENE: True
    - NAME: random_world_flip
      ALONG_AXIS_LIST: ['x']
    - NAME: random_world_scaling
      WORLD_SCALE_RANGE: [0.95, 1.05]
    - NAME: random_world_rotation
      WORLD_ROT_ANGLE: [-0.1, 0.1]

DATA_PROCESSOR:
  - NAME: mask_points_and_boxes_outside_range
    REMOVE_OUTSIDE_BOXES: True

  - NAME: shuffle_points
    SHUFFLE_ENABLED:
      train: True
      test: False

  - NAME: transform_points_to_voxels_placeholder
    VOXEL_SIZE: [0.16, 0.16, 5.0]
