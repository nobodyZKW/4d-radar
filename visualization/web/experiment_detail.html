<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实验详情</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1 id="title">实验详情</h1>
        <div class="hint" id="subtitle">加载中...</div>
      </div>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/experiments">实验总览</a>
        <a href="/compare">对比</a>
        <a href="/sample-viewer">样本查看器</a>
        <a href="/v1_5-results">v1.5 专题</a>
      </nav>
    </header>

    <section class="panel">
      <div class="row">
        <button id="toCompareBtn">加入对比</button>
        <a id="sampleLink" href="/sample-viewer">查看样本预测</a>
      </div>
      <div id="basicInfo"></div>
    </section>

    <section class="panel">
      <h2>Quick Metrics</h2>
      <div id="quickMetrics" class="metric-grid"></div>
      <div id="curveLoss" class="chart" style="margin-top:10px"></div>
      <div id="curveLR" class="chart" style="margin-top:10px"></div>
    </section>

    <section class="panel">
      <h2>Official Metrics</h2>
      <div id="officialSummary" class="metric-grid"></div>
      <div id="officialRows" style="margin-top:10px"></div>
    </section>

    <section class="panel">
      <h2>配置摘要</h2>
      <div id="configSummary"></div>
    </section>

    <section class="panel">
      <h2>Ablation</h2>
      <div id="ablationContent"></div>
    </section>

    <section class="panel">
      <h2>Decode / NMS Tuning</h2>
      <div id="decodeContent"></div>
    </section>

    <section class="panel">
      <h2>Artifacts</h2>
      <div id="artifacts"></div>
    </section>
  </div>
  <script src="/common.js"></script>
  <script src="/experiment_detail.js"></script>
</body>
</html>
