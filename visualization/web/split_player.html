<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4D Radar 50/50 Player</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <main class="layout">
    <header class="hero">
      <div>
        <p class="kicker">4D RADAR VISUAL PLAYER</p>
        <h1>训练集 / 测试集 50/50 子页面</h1>
        <p class="sub">左半屏: 相机图像 + 标签框 | 右半屏: 雷达 BEV 点云</p>
      </div>
      <div class="status-row">
        <span id="serverBadge" class="badge badge-warn">Server: Checking</span>
        <a class="quick-link" href="/">Back to Dashboard</a>
      </div>
    </header>

    <section class="panel">
      <h2>训练集播放器（train）</h2>
      <div class="controls">
        <label>FPS
          <input id="trainFpsInput" type="number" min="1" max="30" value="8" />
        </label>
        <label>Step
          <input id="trainStepInput" type="number" min="1" max="30" value="1" />
        </label>
        <label>Max BEV Points
          <input id="trainPointInput" type="number" min="500" max="30000" value="8000" />
        </label>
        <button id="trainLoadBtn">Load</button>
        <button id="trainPlayBtn">Play</button>
        <button id="trainPrevBtn">Prev</button>
        <button id="trainNextBtn">Next</button>
      </div>
      <div class="scrub-row">
        <input id="trainFrameSlider" type="range" min="0" max="0" value="0" />
      </div>
      <div class="panel-title-row">
        <span id="trainFrameInfo" class="mono">No frames loaded</span>
        <span id="trainCacheInfo" class="mono"></span>
      </div>
      <div class="canvas-wrap split-5050-wrap">
        <canvas id="trainViewerCanvas" width="1600" height="720"></canvas>
      </div>
      <div class="split-legend">
        <span><b>左侧</b> image + labels</span>
        <span><b>右侧</b> radar BEV (x:0~60m, y:-30~30m)</span>
      </div>
      <div id="trainClassLegend" class="legend"></div>
    </section>

    <section class="panel">
      <h2>测试集播放器（test）</h2>
      <div class="controls">
        <label>FPS
          <input id="testFpsInput" type="number" min="1" max="30" value="8" />
        </label>
        <label>Step
          <input id="testStepInput" type="number" min="1" max="30" value="1" />
        </label>
        <label>Max BEV Points
          <input id="testPointInput" type="number" min="500" max="30000" value="8000" />
        </label>
        <button id="testLoadBtn">Load</button>
        <button id="testPlayBtn">Play</button>
        <button id="testPrevBtn">Prev</button>
        <button id="testNextBtn">Next</button>
      </div>
      <div class="scrub-row">
        <input id="testFrameSlider" type="range" min="0" max="0" value="0" />
      </div>
      <div class="panel-title-row">
        <span id="testFrameInfo" class="mono">No frames loaded</span>
        <span id="testCacheInfo" class="mono"></span>
      </div>
      <div class="canvas-wrap split-5050-wrap">
        <canvas id="testViewerCanvas" width="1600" height="720"></canvas>
      </div>
      <div class="split-legend">
        <span><b>左侧</b> image + labels</span>
        <span><b>右侧</b> radar BEV (x:0~60m, y:-30~30m)</span>
      </div>
      <div id="testClassLegend" class="legend"></div>
    </section>
  </main>

  <script src="./split_player.js"></script>
</body>
</html>
