<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4D Radar Baseline Results</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <main class="layout">
    <header class="hero">
      <div>
        <p class="kicker">4D RADAR BASELINE</p>
        <h1>Baseline 结果界面</h1>
        <p class="sub">展示 baseline 训练历史、数据统计，以及训练集/测试集标签播放。</p>
      </div>
      <div class="status-row">
        <span id="healthBadge" class="badge badge-warn">Server: Checking</span>
        <span id="historyBadge" class="badge badge-warn">History: Unknown</span>
        <a class="quick-link" href="/">Main</a>
        <a class="quick-link" href="/v1-results">V1 Results</a>
        <a class="quick-link" href="/split-player">50/50 Player</a>
      </div>
    </header>

    <section class="panel metrics-panel">
      <div class="panel-title-row">
        <h2>Baseline Metrics</h2>
        <span id="historyPath" class="mono"></span>
      </div>
      <div class="metric-cards" id="metricCards"></div>
      <div class="chart-wrap">
        <canvas id="f1Chart" class="chart-canvas" width="980" height="280"></canvas>
      </div>
      <div class="table-wrap">
        <table id="latestTable">
          <thead>
            <tr><th>Metric</th><th>Value</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel data-panel">
      <h2>数据概览</h2>
      <div class="dataset-grid" id="datasetGrid"></div>
    </section>

    <section class="split-grid">
      <section class="panel player-panel">
        <div class="panel-title-row">
          <h2>训练集展示</h2>
          <span id="trainCurrentInfo" class="mono"></span>
        </div>
        <div class="dataset-grid mini-grid" id="trainStats"></div>
        <h3>训练集类别分布</h3>
        <div id="trainClassBars" class="class-bars"></div>
        <div class="controls">
          <label>FPS
            <input id="trainFpsInput" type="number" min="1" max="20" value="6" />
          </label>
          <label>Step
            <input id="trainStepInput" type="number" min="1" max="20" value="1" />
          </label>
          <button id="trainLoadBtn">Load</button>
          <button id="trainPlayBtn">Play</button>
          <button id="trainPrevBtn">Prev</button>
          <button id="trainNextBtn">Next</button>
        </div>
        <div class="scrub-row">
          <input id="trainFrameSlider" type="range" min="0" max="0" value="0" />
        </div>
        <div class="canvas-wrap">
          <canvas id="trainViewerCanvas" width="1280" height="720"></canvas>
        </div>
        <div id="trainLegend" class="legend"></div>
      </section>

      <section class="panel player-panel">
        <div class="panel-title-row">
          <h2>测试集展示</h2>
          <span id="testCurrentInfo" class="mono"></span>
        </div>
        <div class="dataset-grid mini-grid" id="testStats"></div>
        <h3>测试集类别分布</h3>
        <div id="testClassBars" class="class-bars"></div>
        <div class="controls">
          <label>FPS
            <input id="testFpsInput" type="number" min="1" max="20" value="6" />
          </label>
          <label>Step
            <input id="testStepInput" type="number" min="1" max="20" value="1" />
          </label>
          <button id="testLoadBtn">Load</button>
          <button id="testPlayBtn">Play</button>
          <button id="testPrevBtn">Prev</button>
          <button id="testNextBtn">Next</button>
        </div>
        <div class="scrub-row">
          <input id="testFrameSlider" type="range" min="0" max="0" value="0" />
        </div>
        <div class="canvas-wrap">
          <canvas id="testViewerCanvas" width="1280" height="720"></canvas>
        </div>
        <div id="testLegend" class="legend"></div>
      </section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
